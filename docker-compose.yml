services:
  # ── MongoDB Replica Set / Primary ──────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: vision-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis In-Memory Cache & Buffer ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Vision API Backend ─────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vision-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/vision
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost,http://localhost:80,http://localhost:5173
      - SECRET_KEY=vision-super-secret-jwt-key-prod
      - REFRESH_SECRET=vision-super-secret-refresh-key-prod
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Vision React Client (Nginx) ────────────────────────────────
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vision-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

  # ── Prometheus Telemetry Scraper ───────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: vision-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
